# Render Blueprint — BIT Agents Python API
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render and use this file (Docker), OR create a
# native Python Web Service with root directory `agent/new`, build command
# `pip install -r requirements.txt`, and start command
# `uvicorn agents_api:app --host 0.0.0.0 --port $PORT`.
#
# IMPORTANT: prefer numInstances: 1 for now — Hedge Fund paper monitor + in-memory
# research caches are still process-local. DCA/Volume/EasyA schedulers use
# SELECT … FOR UPDATE SKIP LOCKED claim leases and are multi-instance safe.

services:
  - type: web
    name: bitagents-agents-api
    runtime: docker
    dockerfilePath: ./agent/new/Dockerfile
    dockerContext: ./agent/new
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: AGENTS_API_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: CAPIX_API_KEY
        sync: false
      - key: CAPIX_API_URL
        value: https://www.capix.network/api/v1/chat/completions
      - key: CAPIX_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: CAPIX_PROVIDER
        value: DeepInfra
      - key: CAPIX_CONNECT_TIMEOUT
        value: "10"
      - key: CAPIX_READ_TIMEOUT
        value: "45"
      - key: CAPIX_MAX_RETRIES
        value: "2"
      - key: AGENTS_INTERNAL_API_KEY
        sync: false
      - key: SOLANA_CLUSTER
        value: mainnet
      - key: SOLANA_RPC_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: BITAGENTS_PUBLIC_URL
        sync: false
      - key: TOKEN_RESEARCH_CACHE_TTL_SECONDS
        value: "900"
      - key: WALLET_MONITORING_CACHE_TTL_SECONDS
        value: "900"
      # Optional wallet keys — set in dashboard when enabling live trading agents
      - key: DCA_WALLET_PRIVATE_KEY
        sync: false
      - key: VOLUME_AGENT_WALLET_PRIVATE_KEY
        sync: false
      - key: EASYA_ANALYSIS_AGENT_WALLET_PRIVATE_KEY
        sync: false
      - key: HEDGE_FUND_WALLET_PRIVATE_KEY
        sync: false
      - key: EZ_API_KEY
        sync: false
