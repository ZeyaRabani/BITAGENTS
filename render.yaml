# Render Blueprint — BIT Agents Python API
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render and use this file, OR create a Docker Web Service
# manually with root directory `agent/new` and the start command below.
#
# numInstances: as of the scheduler + cache_store fixes on serverless-dca-prototype,
# running more than 1 instance is now SAFE (schedulers use SELECT...FOR UPDATE
# SKIP LOCKED so two instances can't double-fire the same job). Kept at 1 here
# as the default until tested live with real traffic — to try 2+, also set
# CACHE_BACKEND=postgres below (in-memory cache is per-instance and just gets
# less effective, not incorrect, without it).

services:
  - type: web
    name: bitagents-agents-api
    runtime: docker
    dockerfilePath: ./agent/new/Dockerfile
    dockerContext: ./agent/new
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: AGENTS_API_HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: CAPIX_API_KEY
        sync: false
      - key: CAPIX_API_URL
        value: https://www.capix.network/api/v1/chat/completions
      - key: CAPIX_MODEL
        value: meta-llama/llama-3.1-8b-instruct
      - key: CAPIX_PROVIDER
        value: DeepInfra
      - key: CACHE_BACKEND
        value: memory # set to "postgres" before raising numInstances above 1
      - key: AGENTS_INTERNAL_API_KEY
        sync: false
      - key: SOLANA_CLUSTER
        value: mainnet
      - key: SOLANA_RPC_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: BITAGENTS_PUBLIC_URL
        sync: false
      - key: TOKEN_RESEARCH_CACHE_TTL_SECONDS
        value: "900"
      - key: WALLET_MONITORING_CACHE_TTL_SECONDS
        value: "900"
      # Optional wallet keys — set in dashboard when enabling live trading agents
      - key: DCA_WALLET_PRIVATE_KEY
        sync: false
      - key: VOLUME_AGENT_WALLET_PRIVATE_KEY
        sync: false
      - key: EASYA_ANALYSIS_AGENT_WALLET_PRIVATE_KEY
        sync: false
      - key: EZ_API_KEY
        sync: false
